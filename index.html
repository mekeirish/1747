<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1747</title>
  <style>
    :root {
      --bg-main: #0d1117;
      --bg-surface: #161b22;
      --bg-elevated: #21262d;
      --border-subtle: #30363d;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --danger: #f85149;
      --text-primary: #f0f6fc;
      --text-muted: #8b949e;
      --radius-lg: 14px;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.3px;
    }

    .counter-badge {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: var(--radius-md);
      padding: 9px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--accent);
      color: #05131d;
    }

    .btn-danger {
      background: rgba(248, 81, 73, 0.15);
      color: var(--danger);
      border: 1px solid rgba(248, 81, 73, 0.35);
      padding: 9px 10px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px;
      gap: 14px;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .stage-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #05070a;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
    }

    .stage-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 0.2s ease;
      display: none;
    }

    .stage-image.visible {
      display: block;
    }

/* Overlay texte dans la moitié droite de l'image, centré */
.stage-text-overlay {
  position: absolute;
  top: 0;
  right: 0;
  width: 50%;
  height: 100%;
  padding: 28px;
  display: none;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: linear-gradient(90deg, rgba(5, 7, 10, 0.18) 0%, rgba(5, 7, 10, 0.72) 28%, rgba(5, 7, 10, 0.84) 100%);
  pointer-events: none;
  z-index: 3;
}

    .stage-text-overlay.visible {
      display: flex;
    }

.stage-text-content {
  box-sizing: border-box;
  color: #ffffff;
  font-weight: 700;
  line-height: 1.25;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
  word-wrap: break-word;
  overflow-wrap: anywhere;
  max-width: 100%;
  max-height: 100%;
  overflow: hidden;
}

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 12px;
      color: var(--text-muted);
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .empty-state svg {
      color: var(--accent);
      opacity: 0.85;
    }

    .empty-state p {
      font-size: 0.92rem;
      max-width: 260px;
      line-height: 1.4;
    }

    .fit-toggle {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(13, 17, 23, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--text-primary);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 7px;
      display: none;
      cursor: pointer;
      z-index: 5;
    }

    .fit-toggle.visible {
      display: block;
    }
.play-stage-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: rgba(13, 17, 23, 0.82);
  border: 2px solid var(--accent);
  color: var(--accent);
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 6;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
  transition: transform 0.14s ease, background-color 0.15s ease;
}
.play-stage-btn.visible {
  display: flex;
}
.play-stage-btn:active {
  transform: translate(-50%, -50%) scale(0.92);
}

    .dock {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 12px;
    }

    .dock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .thumbs-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .thumb-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .slot-top-btn {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 0.68rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      overflow: hidden;
    }

    .slot-top-btn.has-text {
      width: 100%;
      height: 24px;
      padding: 0 6px;
      background-color: rgba(56, 189, 248, 0.14);
      border-color: var(--accent);
      color: var(--text-primary);
      justify-content: flex-start;
    }

    .slot-top-btn .btn-text-preview {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: left;
    }

    .slot-top-btn:active {
      transform: scale(0.95);
    }

    .slot-top-btn.placeholder {
      visibility: hidden;
      pointer-events: none;
    }

    .thumb-item {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--border-subtle);
      background-color: #05070a;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .thumb-item:active {
      transform: scale(0.95);
    }

    .thumb-item.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
.thumb-item.dragging {
  opacity: 0.45;
  transform: scale(0.92);
}
.thumb-item.drag-over {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.slot-bottom-btn {
  width: 100%;
  height: 22px;
  border-radius: 6px;
  background-color: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  font-size: 0.65rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  transition: all 0.15s ease;
  overflow: hidden;
  padding: 0 5px;
}
.slot-bottom-btn.has-audio {
  background-color: rgba(56, 189, 248, 0.16);
  border-color: var(--accent);
  color: var(--accent);
}
.slot-bottom-btn:active {
  transform: scale(0.95);
}
.slot-bottom-btn.placeholder {
  visibility: hidden;
  pointer-events: none;
}

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-index {
      position: absolute;
      bottom: 4px;
      left: 4px;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .thumb-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(248, 81, 73, 0.92);
      color: #fff;
      border: none;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .thumb-add {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      border: 1.5px dashed var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .thumb-add:active {
      transform: scale(0.95);
    }

    .text-dock {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .text-dock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .text-input-row {
      display: flex;
      align-items: stretch;
      gap: 10px;
    }

    .btn-paste {
      flex: 0 0 auto;
      background-color: var(--bg-elevated);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .btn-paste:active {
      transform: scale(0.95);
      background-color: rgba(56, 189, 248, 0.18);
    }

    .pasted-display {
      flex: 1;
      min-height: 68px;
      max-height: 140px;
      background-color: #05070a;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.85rem;
      line-height: 1.45;
      resize: none;
      outline: none;
      user-select: text;
    }

    .pasted-display:focus {
      border-color: var(--accent);
    }

    .pasted-display::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }
.compile-dock {
  width: 100%;
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.compile-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.btn-compile {
  width: 100%;
  background: var(--accent);
  color: #05131d;
  border: none;
  border-radius: var(--radius-md);
  padding: 11px 16px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.12s ease, opacity 0.15s ease;
}
.btn-compile:active {
  transform: scale(0.97);
}
.btn-compile:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.btn-download {
  width: 100%;
  background: var(--bg-elevated);
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: none;
  display: none;
  align-items: center;
  justify-content: center;
  transition: transform 0.12s ease, background-color 0.15s ease;
}
.btn-download.visible {
  display: flex;
  cursor: pointer;
}
.btn-download:active {
  transform: scale(0.97);
}
.compiled-video-box {
  width: 100%;
  display: none;
  flex-direction: column;
  gap: 8px;
}
.compiled-video-box.visible {
  display: flex;
}
.compiled-video-player {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: var(--radius-md);
  background-color: #05070a;
  border: 1px solid var(--border-subtle);
  display: block;
}

    .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%) translateY(-16px);
      background: var(--bg-elevated);
      border: 1px solid var(--accent);
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 50;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
.drag-ghost {
  position: fixed;
  width: 66px;
  height: 66px;
  border-radius: 10px;
  overflow: hidden;
  border: 2px solid var(--accent);
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.65);
  pointer-events: none;
  z-index: 90;
  transform: translate(-50%, -50%) scale(1.06);
}
.drag-ghost img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
  </style>

<body>

  <!-- Input galerie caché -->
  <input type="file" id="galleryInput" accept="image/*" multiple hidden />

  <div id="toast" class="toast"></div>

  <header>
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2" />
        <circle cx="8" cy="10" r="1.5" />
        <path d="M21 15l-5-5L5 19" />
      </svg>
      <span>Écran 16/9</span>
      <span id="counterBadge" class="counter-badge">0 / 0</span>
    </div>

    <div class="header-actions">
      <button id="clearBtn" class="btn btn-danger" title="Tout effacer" style="display: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
        </svg>
      </button>
      <button id="uploadBtn" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Photos</span>
      </button>
    </div>
  </header>

  <main>
    <!-- Écran 16/9 -->
    <div class="stage-wrapper" id="stageWrapper">
      <div class="empty-state" id="emptyState">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3" y="3" width="18" height="18" rx="3" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <polyline points="21 15 16 10 5 21" />
        </svg>
        <p>Appuyez ici pour sélectionner des photos depuis la galerie</p>
      </div>

      <img id="stageImage" class="stage-image" alt="Aperçu 16/9" />

      <!-- Texte superposé sur la moitié droite de l'image, centré -->
      <div id="stageTextOverlay" class="stage-text-overlay">
        <div id="stageTextContent" class="stage-text-content"></div>
      </div>
      <button type="button" id="playStageBtn" class="play-stage-btn" aria-label="Lire l'animation">
        <svg id="playStageIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="6 4 20 12 6 20 6 4"></polygon>
        </svg>
      </button>

      <button id="fitToggle" class="fit-toggle">Adapter : Entier</button>
    </div>

    <!-- Grille des miniatures 4 colonnes -->
    <section class="dock">
      <div class="dock-header">
        <span>Miniatures</span>
        <span id="fileNameLabel">Aucune image</span>
      </div>
      <div class="thumbs-grid" id="thumbsGrid"></div>
    </section>

    <!-- Élément texte en bas avec bouton Coller -->
    <section class="text-dock">
      <div class="text-dock-header">
        <span>Texte & Paragraphes</span>
        <span id="paraCountLabel">0 paragraphe</span>
      </div>
      <div class="text-input-row">
        <button type="button" id="pasteBtn" class="btn-paste">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
          </svg>
          <span>Coller</span>
        </button>
        <textarea
          id="pastedDisplay"
          class="pasted-display"
          placeholder="Appuyez sur Coller pour insérer votre texte ici..."
        ></textarea>
      </div>
    </section>
    <section class="compile-dock">
      <div class="compile-header">
        <span>Compilation Vidéo 16/9</span>
        <span id="compileStatusLabel">Prêt</span>
      </div>

const state = {

    let toastTimer = null;

    function haptic() {

    function splitIntoParagraphs(text) {
      return text
        .split(/\r?\n+/)
        .map(line => line.trim())
        .filter(line => line.length > 0);
    }

// Calcule la taille de police optimale et uniforme basée sur le paragraphe le plus contraignant
function computeUniformFontSize() {
  const stageRect = el.stageWrapper.getBoundingClientRect();
  if (!stageRect.width || !stageRect.height || state.paragraphs.length === 0) {
    state.uniformFontSize = 14;
    return;
  }

  // Marge de sécurité généreuse (padding 28px + marge de respiration en bas/haut)
  const availW = Math.max(40, Math.floor((stageRect.width * 0.5) - 64));
  const availH = Math.max(32, Math.floor(stageRect.height - 68));

  const bodyFont = getComputedStyle(document.body).fontFamily;
  const measurer = document.createElement('div');
  measurer.style.position = 'fixed';
  measurer.style.top = '-9999px';
  measurer.style.left = '-9999px';
  measurer.style.visibility = 'hidden';
  measurer.style.pointerEvents = 'none';
  measurer.style.boxSizing = 'border-box';
  measurer.style.width = availW + 'px';
  measurer.style.fontFamily = bodyFont;
  measurer.style.fontWeight = '700';
  measurer.style.lineHeight = '1.25';
  measurer.style.textAlign = 'center';
  measurer.style.wordWrap = 'break-word';
  measurer.style.overflowWrap = 'anywhere';
  document.body.appendChild(measurer);

  const fitsAtSize = (size) => {
    measurer.style.fontSize = size + 'px';
    for (let i = 0; i < state.paragraphs.length; i++) {
      measurer.textContent = state.paragraphs[i];
      const rect = measurer.getBoundingClientRect();
      if (rect.height > availH || measurer.scrollHeight > availH || measurer.scrollWidth > availW + 1) {
        return false;
      }
    }
    return true;
  };

  let minSize = 6;
  let maxSize = Math.min(32, Math.max(8, Math.floor(stageRect.height * 0.14)));
  let bestSize = minSize;

  while (minSize <= maxSize) {
    const mid = Math.floor((minSize + maxSize) / 2);
    if (fitsAtSize(mid)) {
      bestSize = mid;
      minSize = mid + 1;
    } else {
      maxSize = mid - 1;
    }
  }

  document.body.removeChild(measurer);
  state.uniformFontSize = bestSize;
}

function updateTextAndParagraphs(text) {
  state.rawText = text;
  el.pastedDisplay.value = text;
  state.paragraphs = splitIntoParagraphs(text);

  const count = state.paragraphs.length;
  el.paraCountLabel.textContent = count > 1 ? `${count} paragraphes` : `${count} paragraphe`;

  computeUniformFontSize();
  saveToStorage();
  render();
}

    function processImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const MAX_W = 1600;
            let w = img.width;
            let h = img.height;
            if (w > MAX_W) {
              h = Math.round((h * MAX_W) / w);
              w = MAX_W;
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve({
              id: Date.now() + Math.random(),
              name: file.name,
              url: canvas.toDataURL('image/jpeg', 0.88)
            });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function selectPhoto(index) {
      if (index < 0 || index >= state.photos.length) return;
      state.activeIndex = index;
      haptic();
      render();
    }

function removePhoto(index, event) {
  event.stopPropagation();
  haptic();
  state.photos.splice(index, 1);

  if (state.photos.length === 0) {
    state.activeIndex = -1;
  } else if (state.activeIndex >= state.photos.length) {
    state.activeIndex = state.photos.length - 1;
  }
  saveToStorage();
  render();
}

function render() {
  const total = state.photos.length;
  const hasPhotos = total > 0;

  el.counterBadge.textContent = hasPhotos ? (state.activeIndex + 1) + ' / ' + total : '0 / 0';
  el.clearBtn.style.display = hasPhotos ? 'inline-flex' : 'none';
  el.playStageBtn.classList.toggle('visible', hasPhotos);
  el.compileBtn.disabled = state.isCompiling || !hasPhotos;
  updatePlayButtonUI();

  if (hasPhotos && state.activeIndex >= 0) {
    const current = state.photos[state.activeIndex];
    const currentText = state.paragraphs[state.activeIndex] || '';

    el.emptyState.style.display = 'none';
    el.stageImage.src = current.url;
    el.stageImage.style.objectFit = state.objectFit;
    el.stageImage.classList.add('visible');
    el.fitToggle.classList.add('visible');
    el.fileNameLabel.textContent = current.name;

    if (currentText) {

      el.stageTextContent.style.fontSize = state.uniformFontSize + 'px';

    } else {

      el.stageTextOverlay.classList.remove('visible');
    }
  } else {
    el.emptyState.style.display = 'flex';
    el.stageImage.classList.remove('visible');
    el.stageImage.removeAttribute('src');
    el.stageTextOverlay.classList.remove('visible');
    el.stageTextContent.textContent = '';
    el.fitToggle.classList.remove('visible');
    el.fileNameLabel.textContent = 'Aucune image';
  }

  el.thumbsGrid.innerHTML = '';

  state.photos.forEach((photo, idx) => {
    const slot = document.createElement('div');
    slot.className = 'thumb-slot';

    const paraText = state.paragraphs[idx] || '';
    const topBtn = document.createElement('button');
    topBtn.type = 'button';
    topBtn.className = paraText ? 'slot-top-btn has-text' : 'slot-top-btn';
    topBtn.dataset.index = idx;
    topBtn.ariaLabel = paraText ? 'Paragraphe ' + (idx + 1) + ' : ' + paraText : 'Emplacement texte ' + (idx + 1);

    if (paraText) {
      const span = document.createElement('span');
      span.className = 'btn-text-preview';
      span.textContent = paraText;
      topBtn.appendChild(span);
      topBtn.onclick = () => {
        haptic();

    } else {
      topBtn.onclick = () => haptic();

    const item = document.createElement('div');
    item.className = idx === state.activeIndex ? 'thumb-item active' : 'thumb-item';
    item.dataset.index = idx;

    let movedDuringTouch = false;

    item.addEventListener('touchstart', (e) => {
      if (e.target.closest('.thumb-remove')) return;
      const touch = e.touches[0];

    item.addEventListener('touchmove', (e) => {
      if (!dragState || dragState.fromIndex !== idx) return;
      const touch = e.touches[0];
      const dx = touch.clientX - dragState.startX;
      const dy = touch.clientY - dragState.startY;

      if (!dragState.active && Math.hypot(dx, dy) > 8) {
        dragState.active = true;
        movedDuringTouch = true;
        haptic();
        item.classList.add('dragging');

        const ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        const ghostImg = document.createElement('img');
        ghostImg.src = photo.url;
        ghost.appendChild(ghostImg);

      }

      if (dragState.active) {
        e.preventDefault();
        if (dragState.ghost) {
          dragState.ghost.style.left = touch.clientX + 'px';
          dragState.ghost.style.top = touch.clientY + 'px';
        }

        const under = document.elementFromPoint(touch.clientX, touch.clientY);
        const overThumb = under ? under.closest('.thumb-item') : null;
        el.thumbsGrid.querySelectorAll('.thumb-item').forEach((n) => n.classList.remove('drag-over'));

        if (overThumb && overThumb.dataset.index !== undefined) {
          const overIdx = Number(overThumb.dataset.index);
          dragState.targetIndex = overIdx;
          if (overIdx !== dragState.fromIndex) {
            overThumb.classList.add('drag-over');
          }
        }
      }
    }, { passive: false });

    item.addEventListener('touchend', () => {
      if (!dragState || dragState.fromIndex !== idx) return;
      const wasActive = dragState.active;
      const fromIdx = dragState.fromIndex;
      const toIdx = dragState.targetIndex;
      clearDragVisuals();

      if (wasActive) {
        reorderPhotos(fromIdx, toIdx);
      }
    });

    item.addEventListener('touchcancel', () => {
      clearDragVisuals();
    });

    item.onclick = () => {
      if (movedDuringTouch) {
        movedDuringTouch = false;
        return;
      }
      selectPhoto(idx);
    };

    const img = document.createElement('img');
    img.src = photo.url;
    img.alt = 'Miniature ' + (idx + 1);

    const badge = document.createElement('span');
    badge.className = 'thumb-index';
    badge.textContent = idx + 1;

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'thumb-remove';
    delBtn.innerHTML = '&times;';
    delBtn.ariaLabel = 'Supprimer';
    delBtn.onclick = (e) => removePhoto(idx, e);

    item.append(img, badge, delBtn);

    const hasAudio = Boolean(photo.audioUrl && photo.audioUrl.trim().length > 0);
    const bottomBtn = document.createElement('button');
    bottomBtn.type = 'button';
    bottomBtn.className = hasAudio ? 'slot-bottom-btn has-audio' : 'slot-bottom-btn';
    bottomBtn.dataset.index = idx;
    bottomBtn.ariaLabel = 'Son photo ' + (idx + 1);
    bottomBtn.textContent = hasAudio ? '♪ Son OK' : '♪ Son';
    bottomBtn.onclick = (e) => {
      e.stopPropagation();
      assignAudioLink(idx);
    };

    slot.append(topBtn, item, bottomBtn);
    el.thumbsGrid.appendChild(slot);
  });

  const addSlot = document.createElement('div');
  addSlot.className = 'thumb-slot';

  const placeholderBtn = document.createElement('div');
  placeholderBtn.className = 'slot-top-btn placeholder';

  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'thumb-add';
  addBtn.ariaLabel = 'Ajouter des photos';
  addBtn.textContent = '+';
  addBtn.onclick = triggerGallery;

  const bottomPlaceholder = document.createElement('div');
  bottomPlaceholder.className = 'slot-bottom-btn placeholder';

  addSlot.append(placeholderBtn, addBtn, bottomPlaceholder);
  el.thumbsGrid.appendChild(addSlot);
}

    function triggerGallery() {
      haptic();
      el.galleryInput.click();
    }

    el.uploadBtn.addEventListener('click', triggerGallery);
    el.emptyState.addEventListener('click', triggerGallery);

el.galleryInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;

  const wasEmpty = state.photos.length === 0;
  showToast(`Chargement de ${files.length} photo(s)...`);  const processed = await Promise.all(files.map(processImageFile)); state.photos.push(...processed);    if (wasEmpty && state.photos.length > 0) { state.activeIndex = 0; }    el.galleryInput.value = ''; saveToStorage(); computeUniformFontSize(); render(); showToast(`${files.length} photo(s) ajoutée(s)`);
});

    el.pasteBtn.addEventListener('click', async () => {

el.clearBtn.addEventListener('click', () => {

el.playStageBtn.addEventListener('click', (e) => {

    // Recalcule la taille uniforme si l'orientation ou la largeur d'écran change

// Navigation tactile par glissement (Swipe gauche/droite sur l'écran 16/9)
let touchStartX = 0;
let dragState = null;
function reorderPhotos(fromIndex, toIndex) {
  if (
    fromIndex === toIndex ||
    fromIndex < 0 ||
    fromIndex >= state.photos.length ||
    toIndex < 0 ||
    toIndex >= state.photos.length
  ) {
    return;
  }

  const activePhoto = state.activeIndex >= 0 ? state.photos[state.activeIndex] : null;
  const [moved] = state.photos.splice(fromIndex, 1);
  state.photos.splice(toIndex, 0, moved);

  if (activePhoto) {
    state.activeIndex = state.photos.indexOf(activePhoto);
  }

  haptic();
  render();
}
function clearDragVisuals() {
  if (dragState && dragState.ghost) {
    dragState.ghost.remove();
  }
  el.thumbsGrid.querySelectorAll('.thumb-item').forEach((node) => {
    node.classList.remove('dragging', 'drag-over');
  });
  dragState = null;
}
function saveToStorage() {
  try {
    const payload = {
      photos: state.photos,
      activeIndex: state.activeIndex,
      objectFit: state.objectFit,
      rawText: state.rawText
    };
    localStorage.setItem('visionneuse_16_9_state', JSON.stringify(payload));
  } catch (err) {
    // Ignore quota exceeded errors
  }
}
function loadFromStorage() {
  try {
    const raw = localStorage.getItem('visionneuse_16_9_state');
    if (!raw) return;
    const data = JSON.parse(raw);
    if (Array.isArray(data.photos)) {
      state.photos = data.photos;
      state.activeIndex = typeof data.activeIndex === 'number' ? data.activeIndex : (data.photos.length > 0 ? 0 : -1);
      if (state.activeIndex >= state.photos.length) {
        state.activeIndex = state.photos.length - 1;
      }
    }
    if (data.objectFit === 'contain' || data.objectFit === 'cover') {
      state.objectFit = data.objectFit;
    }
    if (typeof data.rawText === 'string' && data.rawText.length > 0) {
      state.rawText = data.rawText;
      el.pastedDisplay.value = data.rawText;
      state.paragraphs = splitIntoParagraphs(data.rawText);
      const count = state.paragraphs.length;
      el.paraCountLabel.textContent = count > 1 ? count + ' paragraphes' : count + ' paragraphe';
    }
  } catch (err) {
    // Ignore parse errors
  }
}
let playbackAudio = null;
let playbackTimer = null;
let playbackToken = 0;
function stopPlayback() {
  playbackToken++;
  state.isPlaying = false;
  if (playbackTimer) {
    clearTimeout(playbackTimer);
    playbackTimer = null;
  }
  if (playbackAudio) {
    playbackAudio.pause();
    playbackAudio.currentTime = 0;
    playbackAudio = null;
  }
  updatePlayButtonUI();
}
function updatePlayButtonUI() {
  if (!el.playStageIcon) return;
  if (state.isPlaying) {
    el.playStageIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
  } else {
    el.playStageIcon.innerHTML = '<polygon points="6 4 20 12 6 20 6 4"></polygon>';
  }
}
function playSlideAt(index, token) {
  if (token !== playbackToken || !state.isPlaying) return;
  if (index >= state.photos.length) {
    stopPlayback();
    showToast('Lecture terminée');
    return;
  }

  state.activeIndex = index;
  render();

  const photo = state.photos[index];
  const audioUrl = (photo && photo.audioUrl ? photo.audioUrl : '').trim();
  let advanced = false;

  const goNext = () => {
    if (advanced || token !== playbackToken || !state.isPlaying) return;
    advanced = true;
    if (playbackTimer) {
      clearTimeout(playbackTimer);
      playbackTimer = null;
    }
    if (playbackAudio) {
      playbackAudio.onended = null;
      playbackAudio.onerror = null;
      playbackAudio.pause();
      playbackAudio.currentTime = 0;
      playbackAudio = null;
    }
    playSlideAt(index + 1, token);
  };

  if (audioUrl) {
    try {
      const audio = new Audio();
      playbackAudio = audio;
      audio.preload = 'auto';
      audio.src = audioUrl;

      audio.onended = () => {
        goNext();
      };

      audio.onerror = () => {
        if (!advanced && token === playbackToken && state.isPlaying) {
          playbackTimer = setTimeout(goNext, 2500);
        }
      };

      const playPromise = audio.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(() => {
          if (!advanced && token === playbackToken && state.isPlaying) {
            playbackTimer = setTimeout(goNext, 2500);
          }
        });
      }
      return;
    } catch (err) {
      playbackTimer = setTimeout(goNext, 2500);
      return;
    }
  }

  playbackTimer = setTimeout(goNext, 2500);
}
function startSequencePlayback() {
  if (state.photos.length === 0) return;
  if (state.isPlaying) {
    stopPlayback();
    return;
  }
  haptic();
  state.isPlaying = true;
  updatePlayButtonUI();
  playbackToken++;
  const token = playbackToken;
  playSlideAt(0, token);
}
async function assignAudioLink(index) {
  if (index < 0 || index >= state.photos.length) return;
  stopPlayback();
  haptic();

  let pastedUrl = '';
  try {
    if (navigator.clipboard && navigator.clipboard.readText) {
      const clip = await navigator.clipboard.readText();
      if (clip && clip.trim().length > 0) {
        pastedUrl = clip.trim();
      }
    }
  } catch (err) {
    // Fallback si accès presse-papiers refusé
  }

  if (pastedUrl) {
    state.photos[index].audioUrl = pastedUrl;
    saveToStorage();
    render();
    showToast('Son collé sur photo ' + (index + 1));
    return;
  }

  el.pastedDisplay.focus();
  showToast('Copiez le lien du son puis réappuyez sur le bouton son');
}
function loadImageElement(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function drawCompiledFrame(ctx, width, height, img, text, fontSize, fitMode) {
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, width, height);

  if (img && img.width && img.height) {
    const imgRatio = img.width / img.height;
    const canvasRatio = width / height;
    let drawW = width;
    let drawH = height;
    let drawX = 0;
    let drawY = 0;

    if (fitMode === 'cover') {
      if (imgRatio > canvasRatio) {
        drawW = height * imgRatio;
        drawX = (width - drawW) / 2;
      } else {
        drawH = width / imgRatio;
        drawY = (height - drawH) / 2;
      }
    } else {
      if (imgRatio > canvasRatio) {
        drawH = width / imgRatio;
        drawY = (height - drawH) / 2;
      } else {
        drawW = height * imgRatio;
        drawX = (width - drawW) / 2;
      }
    }

    ctx.drawImage(img, drawX, drawY, drawW, drawH);
  }

  if (text && text.trim().length > 0) {
    const halfX = width * 0.5;
    const halfW = width * 0.5;

    const grad = ctx.createLinearGradient(halfX, 0, width, 0);
    grad.addColorStop(0, 'rgba(5, 7, 10, 0.18)');
    grad.addColorStop(0.28, 'rgba(5, 7, 10, 0.72)');
    grad.addColorStop(1, 'rgba(5, 7, 10, 0.84)');
    ctx.fillStyle = grad;
    ctx.fillRect(halfX, 0, halfW, height);

    const pad = Math.round(height * 0.08);
    const maxW = Math.max(40, halfW - pad * 2);
    const stageRect = el.stageWrapper.getBoundingClientRect();
    const scaleRatio = stageRect.height > 0 ? height / stageRect.height : 1;
    const scaledSize = Math.max(12, Math.round(fontSize * scaleRatio));
    const lineHeight = Math.round(scaledSize * 1.25);

    ctx.save();
    ctx.font = '700 ' + scaledSize + 'px ' + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
    ctx.shadowBlur = Math.round(8 * scaleRatio);
    ctx.shadowOffsetY = Math.round(2 * scaleRatio);

    const words = text.trim().split(/\s+/);
    const lines = [];
    let currentLine = '';

    for (let i = 0; i < words.length; i++) {
      const candidate = currentLine ? currentLine + ' ' + words[i] : words[i];
      if (ctx.measureText(candidate).width <= maxW || !currentLine) {
        currentLine = candidate;
      } else {
        lines.push(currentLine);
        currentLine = words[i];
      }
    }
    if (currentLine) lines.push(currentLine);

    const totalBlockH = lines.length * lineHeight;
    const startY = (height - totalBlockH) / 2 + lineHeight / 2;
    const centerX = halfX + halfW / 2;

    for (let i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], centerX, startY + i * lineHeight, maxW);
    }
    ctx.restore();
  }
}
function runSlideForCompilation(index, ctx, width, height, audioDest, audioCtx) {
  return new Promise(async (resolve) => {
    const photo = state.photos[index];
    const text = state.paragraphs[index] || '';
    let img = null;
    try {
      img = await loadImageElement(photo.url);
    } catch (e) {
      img = null;
    }

    drawCompiledFrame(ctx, width, height, img, text, state.uniformFontSize, state.objectFit);

    let finished = false;
    let fallbackTimer = null;
    let audioEl = null;
    let sourceNode = null;

    const done = () => {
      if (finished) return;
      finished = true;
      if (fallbackTimer) {
        clearTimeout(fallbackTimer);
        fallbackTimer = null;
      }
      if (sourceNode) {
        try { sourceNode.disconnect(); } catch (e) {}
      }
      if (audioEl) {
        audioEl.onended = null;
        audioEl.onerror = null;
        audioEl.pause();
        audioEl = null;
      }
      resolve();
    };

    const audioUrl = (photo && photo.audioUrl ? photo.audioUrl : '').trim();
    if (audioUrl && audioCtx && audioDest) {
      try {
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }
        audioEl = new Audio();
        audioEl.crossOrigin = 'anonymous';
        audioEl.preload = 'auto';
        audioEl.src = audioUrl;

        sourceNode = audioCtx.createMediaElementSource(audioEl);
        sourceNode.connect(audioDest);

        audioEl.onended = done;
        audioEl.onerror = () => {
          fallbackTimer = setTimeout(done, 2500);
        };

        const p = audioEl.play();
        if (p && typeof p.catch === 'function') {
          p.catch(() => {
            fallbackTimer = setTimeout(done, 2500);
          });
        }
        return;
      } catch (err) {
        fallbackTimer = setTimeout(done, 2500);
        return;
      }
    }

    fallbackTimer = setTimeout(done, 2500);
  });
}
async function compileAnimationVideo() {
  if (state.isCompiling || state.photos.length === 0) return;
  if (typeof MediaRecorder === 'undefined') {
    showToast('Compilation vidéo non supportée sur ce navigateur');
    return;
  }

  stopPlayback();
  state.isCompiling = true;
  el.compileBtn.disabled = true;
  el.downloadBtn.classList.remove('visible');
  el.compileStatusLabel.textContent = 'Compilation en cours...';
  showToast('Compilation de la vidéo en cours...');

  const width = 1280;
  const height = 720;
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  const canvasStream = canvas.captureStream(30);
  const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  let audioDest = null;

  try {
    if (AudioCtxClass) {
      audioCtx = new AudioCtxClass();
      audioDest = audioCtx.createMediaStreamDestination();
      audioDest.stream.getAudioTracks().forEach((track) => {
        canvasStream.addTrack(track);
      });
    }
  } catch (err) {
    audioCtx = null;
    audioDest = null;
  }

  const mimeCandidates = [
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm',
    'video/mp4'
  ];
  let chosenMime = '';
  for (let i = 0; i < mimeCandidates.length; i++) {
    if (MediaRecorder.isTypeSupported(mimeCandidates[i])) {
      chosenMime = mimeCandidates[i];
      break;
    }
  }

  const chunks = [];
  const recorder = chosenMime
    ? new MediaRecorder(canvasStream, { mimeType: chosenMime })
    : new MediaRecorder(canvasStream);

  recorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) {
      chunks.push(e.data);
    }
  };

  const stoppedPromise = new Promise((resolve) => {
    recorder.onstop = resolve;
  });

  recorder.start(200);

  for (let i = 0; i < state.photos.length; i++) {
    el.compileStatusLabel.textContent = 'Slide ' + (i + 1) + ' / ' + state.photos.length;
    await runSlideForCompilation(i, ctx, width, height, audioDest, audioCtx);
  }

  recorder.stop();
  await stoppedPromise;

  if (audioCtx) {
    try { await audioCtx.close(); } catch (e) {}
  }

  const blobType = chosenMime || 'video/webm';
  const videoBlob = new Blob(chunks, { type: blobType });
  if (state.compiledVideoUrl) {
    URL.revokeObjectURL(state.compiledVideoUrl);
  }
  state.compiledVideoUrl = URL.createObjectURL(videoBlob);

  el.compiledVideoPlayer.src = state.compiledVideoUrl;
  el.compiledVideoBox.classList.add('visible');
  el.downloadBtn.classList.add('visible');
  el.compileStatusLabel.textContent = 'Vidéo prête';
  state.isCompiling = false;
  el.compileBtn.disabled = false;
  showToast('Compilation terminée');
}
function downloadCompiledVideo() {
  if (!state.compiledVideoUrl) return;
  haptic();
  const ext = (el.compiledVideoPlayer && el.compiledVideoPlayer.src && state.compiledVideoUrl.startsWith('blob:')) ? 'webm' : 'mp4';
  const link = document.createElement('a');
  link.href = state.compiledVideoUrl;
  link.download = 'animation-16-9.' + ext;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast('Téléchargement lancé');
}
    el.stageWrapper.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    el.stageWrapper.addEventListener('touchend', (e) => {
      if (state.photos.length < 2) return;
      const deltaX = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(deltaX) > 45) {
        if (deltaX < 0) {
          selectPhoto((state.activeIndex + 1) % state.photos.length);
        } else {
          selectPhoto((state.activeIndex - 1 + state.photos.length) % state.photos.length);
        }
      }
    }, { passive: true });

loadFromStorage();
computeUniformFontSize();
